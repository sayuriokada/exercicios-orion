# O "name" separa containers, rede e volume do ambiente de prod
name: exercicio-3-dev

services:
  api:
    extends:
      file: docker-compose.base.yml
      service: api
    build:
      context: .
      target: dev
    image: exercicio-3-api:dev
    ports:
      - "${API_PORT_DEV:-3002}:3000"
    volumes:
      - ./src:/app/src # live reload: editar no Mac reinicia a API no container

  db:
    extends:
      file: docker-compose.base.yml
      service: db
    ports:
      - "127.0.0.1:${DB_PORT_DEV:-5433}:5432" # acesso local com psql/DBeaver, só para dev

volumes:
  db_data:

networks:
  backend:
